[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1d_nav_py"
version = "0.1.0"
description = "G1-D navigation: base guard (sole rt/cmd_vel_no_limit writer), NavClient, mock robot"
requires-python = ">=3.8"
dependencies = ["numpy>=1.17", "PyYAML>=5.3"]
# unitree_sdk2py (+ cyclonedds==0.10.2 on the robot) is installed from third_party/unitree_sdk2_python.

[project.optional-dependencies]
dev = ["pytest>=6"]
plot = ["matplotlib"]
# map export cleaning (DUFOMap) on PC2 / the workstation
cleaning = ["dufomap>=1.1"]
# camera person segmentation on PC2 (TensorRT engine built on the Orin)
perception = ["opencv-python", "pyzmq", "ultralytics"]
# 5090 workstation: SAM 3 (install from github.com/facebookresearch/sam3) + training
workstation = ["opencv-python", "ultralytics", "dufomap>=1.1", "Pillow"]

[project.scripts]
g1d-base-guard = "g1d_nav_py.guard_node:main"
g1d-mock-robot = "g1d_nav_py.mock_robot:main"
g1d-fake-nav = "g1d_nav_py.fake_nav:main"
g1d-web = "g1d_web.__main__:main"
g1d-perception = "g1d_perception.node:main"
g1d-mapclean = "g1d_web.mapclean:main"

[tool.setuptools]
packages = ["g1d_nav_py", "g1d_web", "g1d_perception", "g1d_perception.tools"]

[tool.setuptools.package-data]
g1d_web = ["static/*.html", "static/css/*", "static/js/*", "static/vendor/three/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
